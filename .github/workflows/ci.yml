name: Frontend CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Type Check and Build
        env:
          VITE_API_BASE_URL: http://localhost:8001/api/v1
          VITE_BACKEND_URL: http://localhost:8001
        run: npm run build

  validate-container:
    needs: lint-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Build Production Image
        env:
          VITE_API_BASE_URL: http://localhost:8001/api/v1
          VITE_BACKEND_URL: http://localhost:8001
          VITE_TURNSTILE_SITE_KEY: ci-placeholder
        run: docker compose -f docker-compose.PROD.yml build

  deploy-dev:
    needs: [lint-and-build, validate-container]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.DEV_TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.DEV_TS_OAUTH_SECRET }}
          tags: tag:github-ci
          version: latest

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEV_SERVER_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEV_SERVER_IP }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to Dev
        env:
          DEPLOY_HOST: ${{ secrets.DEV_SERVER_IP }}
          DEPLOY_USER: ${{ secrets.DEV_SERVER_USER }}
          DEPLOY_PATH: "~/frontend"
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && git pull --ff-only origin dev && docker compose -f docker-compose.yml up -d --build"

  deploy-prod:
    needs: [lint-and-build, validate-container]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-ci
          version: latest

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.SERVER_IP }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to Production
        env:
          DEPLOY_HOST: ${{ secrets.SERVER_IP }}
          DEPLOY_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PATH: "~/frontend"
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && git pull --ff-only origin main && docker compose -f docker-compose.PROD.yml up -d --build"