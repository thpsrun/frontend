volumes:
    static_files:
      name: thpsrun_static_files
    postgres_data:
      name: thpsrun_postgres_data
    node_modules:
      name: node_modules

services:
  react:
    container_name: react
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command: npm run dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    tty: true
    volumes:
      - ./frontend:/srv/app:rw
      - node_modules:/srv/app/node_modules:rw
    networks:
      - thpsrun

networks:
  thpsrun:
    driver: bridge
